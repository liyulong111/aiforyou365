<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI For You 365</title>
  <meta name="description" content="让知识更好玩，更好记。教材3D互动模型与古诗词图像化记忆。" />
  <style>
    :root{
      --blue:#1769e0;
      --blue-deep:#0b3b82;
      --green:#168447;
      --text:#17345c;
      --muted:#6d7f96;
      --line:#dce9f7;
      --warm:#fff8ec;
      --warm-line:#efd3a6;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);
      background:#fff;
    }
    a{text-decoration:none;color:inherit}
    .wrap{max-width:1240px;margin:auto;padding:0 24px}

    header{
      position:sticky;top:0;z-index:20;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(10px);
      border-bottom:1px solid #eef2f7;
    }
    .bar{min-height:62px;display:flex;justify-content:flex-end;align-items:center}
    nav{display:flex;gap:30px;font-weight:750}
    nav a{padding:20px 0}
    nav a:hover{color:var(--blue)}

    .hero{
      min-height:calc(100vh - 62px);
      background:
        radial-gradient(circle at 50% 8%, rgba(53,145,255,.10), transparent 28%),
        linear-gradient(180deg,#f8fbff 0%,#ffffff 76%);
      overflow:hidden;
    }
    .title{text-align:center;padding:28px 0 8px}
    .title h1{
      margin:0;
      font-size:clamp(46px,6vw,78px);
      line-height:1.08;
      letter-spacing:-2px;
      font-weight:900;
      color:var(--blue-deep);
    }
    .title h1 span{color:var(--green);margin-left:.25em}
    .title p{margin:12px 0 0;color:#64758b;font-size:clamp(17px,2vw,22px)}

    .main-grid{
      display:grid;
      grid-template-columns:minmax(300px,1fr) minmax(340px,.95fr) minmax(300px,1fr);
      gap:26px;
      align-items:center;
      margin-top:8px;
    }
    .panel{
      border:1px solid #cfe4f8;
      border-radius:26px;
      padding:26px;
      background:linear-gradient(180deg,#f9fcff,#edf7ff);
      box-shadow:0 14px 34px rgba(24,84,145,.08);
    }
    .panel.warm{
      border-color:var(--warm-line);
      background:linear-gradient(180deg,#fffaf3,var(--warm));
    }
    .panel h2{margin:0 0 7px;font-size:30px;color:var(--blue-deep)}
    .panel p{margin:0 0 18px;color:var(--muted)}

    .links{display:grid;gap:13px}
    .card{
      min-height:62px;
      display:flex;align-items:center;justify-content:space-between;
      border:1px solid #d7e6f6;border-radius:17px;background:#fff;
      padding:15px 18px;font-size:17px;font-weight:800;
      transition:.18s ease;
    }
    .card:hover{
      transform:translateY(-2px);
      border-color:#83baf3;
      color:var(--blue);
      box-shadow:0 10px 22px rgba(23,105,224,.12);
    }
    .arrow{font-size:24px;font-weight:500}

    .person{
      min-height:510px;
      display:flex;align-items:flex-end;justify-content:center;
      position:relative;
    }
    .person:before{
      content:"";position:absolute;left:6%;right:6%;bottom:10px;height:72%;
      background:radial-gradient(ellipse at center,rgba(188,224,255,.7),rgba(255,255,255,0) 68%);
      filter:blur(8px);
    }
    .person img{
      position:relative;z-index:1;
      width:min(118%,560px);
      max-height:590px;
      object-fit:contain;object-position:center bottom;
      filter:drop-shadow(0 20px 28px rgba(0,0,0,.12));
      -webkit-mask-image:radial-gradient(ellipse 72% 82% at 50% 49%,#000 61%,rgba(0,0,0,.97) 70%,rgba(0,0,0,.55) 85%,transparent 100%);
      mask-image:radial-gradient(ellipse 72% 82% at 50% 49%,#000 61%,rgba(0,0,0,.97) 70%,rgba(0,0,0,.55) 85%,transparent 100%);
    }

    .coming{
      min-height:300px;border:1px dashed #e3ba7d;border-radius:20px;
      display:grid;place-items:center;text-align:center;
      background:radial-gradient(circle at 76% 18%,rgba(255,204,112,.22),transparent 30%),rgba(255,255,255,.65);
    }
    .coming strong{display:block;font-size:38px;color:#8a5410;margin-bottom:8px}
    .coming span{color:#8c7860}

    .features{
      display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
      padding:28px 0 42px;
    }
    .feature{border:1px solid #edf2f7;border-radius:17px;background:#fff;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,.04)}
    .feature b{display:block;margin-bottom:5px}
    .feature span{color:var(--muted);font-size:14px}

    footer{border-top:1px solid #edf2f7;background:#fafcff;padding:22px 0;text-align:center;color:#748197}

    @media(max-width:960px){
      .main-grid{grid-template-columns:1fr}
      .person{order:-1;min-height:380px}
      .person img{max-height:440px;width:min(94%,460px)}
      .features{grid-template-columns:1fr 1fr}
    }
    @media(max-width:620px){
      .wrap{padding:0 16px}
      nav{gap:15px;font-size:14px}
      .title h1{letter-spacing:-1px}
      .title h1 span{display:block;margin-left:0}
      .features{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<header>
  <div class="wrap bar">
    <nav>
      <a href="#top">首页</a>
      <a href="#models">3D模型</a>
      <a href="#poetry">古诗词轻松记</a>
      <a href="#about">关于</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="title">
        <h1>让知识更好玩<span>更好记</span></h1>
        
      </div>

      <div class="main-grid">
        <section class="panel" id="models">
          <h2>教材3D互动模型</h2>
          <p>把抽象知识变得看得见、摸得着</p>
          <div class="links">
            <a class="card" href="3d/eye.html" target="_blank" rel="noopener noreferrer">
              <span>3D光学眼球模型</span><span class="arrow">→</span>
            </a>
            <a class="card" href="3d/engine.html" target="_blank" rel="noopener noreferrer">
              <span>四冲程汽油发动机模型</span><span class="arrow">→</span>
            </a>
            <a class="card" href="3d/heart.html" target="_blank" rel="noopener noreferrer">
              <span>心脏结构模型</span><span class="arrow">→</span>
            </a>
          </div>
        </section>

        <div class="person" aria-label="卡通人物指向两大学习板块">
          <img src="teacher-cartoon.png" alt="卡通人物双手分别指向3D模型和古诗词板块">
        </div>

        <section class="panel warm" id="poetry">
          <h2>必背古诗词轻松记</h2>
          <p>用图像化记忆，帮助理解与背诵</p>
          <div class="coming">
            <div>
              <strong>即将上线</strong>
              <span>古诗词图像记忆内容持续更新中</span>
            </div>
          </div>
        </section>
      </div>

      <div class="features" id="about">
        <div class="feature"><b>适合学生</b><span>让知识更直观，也更容易记住</span></div>
        <div class="feature"><b>适合家长</b><span>陪孩子探索更有趣的学习方式</span></div>
        <div class="feature"><b>适合老师</b><span>增加课堂可视化与互动资源</span></div>
        <div class="feature"><b>持续更新</b><span>3D模型、古诗词与更多学习资源</span></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap">让知识更好玩 · 让知识更好记</div></footer>
</body>
</html>
